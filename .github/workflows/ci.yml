name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: testes unitários (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:unit

  integration:
    # Pendente: tests/integration.test.ts espera injeção de dependências em index.ts
    # que ainda não existe. Remova continue-on-error quando o seam for implementado.
    name: integração (não bloqueante, pendente)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --experimental-strip-types tests/integration.test.ts
